<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IBM Envizi Emissions Calculations</title>

    <!-- Office JavaScript API -->
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>

    <!-- IBM Plex Sans font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
      }

      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: #ffffff;
        color: #161616;
        display: flex;
        flex-direction: column;
      }

      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding-inline: 24px;
        overflow: hidden;
      }

      .heading {
        font-size: 18px;
        font-weight: 600;
        color: #161616;
        line-height: 1.3;
      }

      .message {
        font-size: 14px;
        color: #525252;
        line-height: 1.5;
        margin: 0;
        overflow-wrap: break-word;
        overflow-y: auto;
      }

      .btn-row {
        display: flex;
        justify-content: flex-end;
      }

      .btn {
        height: 64px;
        width: 50%;
        background: #0f62fe;
        color: #ffffff;
        border: none;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.16px;
        cursor: pointer;
      }

      .btn:hover {
        background: #0353e9;
      }
      .btn:active {
        background: #002d9c;
      }
      .btn:focus-visible {
        outline: 2px solid #0f62fe;
        outline-offset: -2px;
      }
      .card-title {
        display: flex;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="card-title">
        <!-- Carbon ErrorFilled 32 icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
          width="24"
          height="24"
          fill="#da1e28"
          aria-hidden="true"
        >
          <path
            d="M16 2C8.3 2 2 8.3 2 16s6.3 14 14 14 14-6.3 14-14S23.7 2 16 2zm-1.1 6h2.2v11h-2.2V8zm1.1 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"
          />
        </svg>
        <h2 class="heading">Error</h2>
      </div>

      <p id="msg" class="message"></p>
    </div>

    <div class="btn-row">
      <button class="btn" id="ok-btn">OK</button>
    </div>

    <script type="text/javascript">
      (function () {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get("message") || "An error occurred";
        document.getElementById("msg").textContent = decodeURIComponent(raw);
      })();

      Office.onReady(function () {
        document.getElementById("ok-btn").addEventListener("click", function () {
          Office.context.ui.messageParent("close");
        });
      });
    </script>
  </body>
</html>
